# Render Blueprint for the Luma Connects FastAPI service.
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
#
# ############################################################################
# CURRENTLY ON THE FREE PLAN, WHICH LOSES DATA. READ THIS BEFORE TAKING MONEY.
#
# Render's free plan cannot attach a persistent disk, so the SQLite file sits
# on an ephemeral filesystem. It is wiped on every deploy, every restart, and
# every wake from idle spin-down (~15 min of no traffic). Two consequences:
#
#   1. A paid order can vanish before it is fulfilled. Customer pays, Stripe
#      fires checkout.session.completed, the service cold-starts with an empty
#      database, mark_order_paid() finds no such order and returns False. You
#      have taken money and delivered nothing.
#   2. http_cache is wiped with it, so already-purchased enrichment is bought
#      again from Apify/Perflo. That is the margin, spent twice.
#
# This is acceptable ONLY for a demo where you control when payments happen.
# For anything real, switch back to the paid config in the block below — the
# $50 hackathon credit covers it, though Render still wants a card on file.
#
# For a live demo where money actually moves, prefer a tunnel to localhost:
#     cloudflared tunnel --url http://localhost:8000
# No card, no cold starts, and the SQLite file persists on your own disk.
# ############################################################################
#
# TO SWITCH BACK TO DURABLE STORAGE, restore these three things:
#     plan: starter
#     numInstances: 1
#     disk: {name: invite-finder-data, mountPath: /data, sizeGB: 1}
# and set INVITE_DB_PATH back to /data/invite_finder.db.

services:
  - type: web
    name: luma-connects-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health

    # No `disk:` and no `numInstances:` — the free plan supports neither.

    envVars:
      # Ephemeral. Survives nothing. See the warning above.
      - key: INVITE_DB_PATH
        value: /tmp/invite_finder.db

      # PUBLIC_BASE_URL is deliberately absent: Settings.from_env() falls back
      # to RENDER_EXTERNAL_URL, which Render injects with this service's real
      # public URL. Hardcoding a guess here would silently be wrong whenever
      # Render appends a suffix to the service name.
      #
      # INVITE_CORS_ORIGINS is also absent — set it to the *frontend's* origin
      # once that is deployed. It is not this service's own URL.

      # Secrets: sync:false means Render prompts for these at deploy time and
      # stores them itself, so nothing sensitive lands in the repo.
      - key: OPENAI_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_SERP_ZONE
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false
      - key: LINQ_API_KEY
        sync: false
      - key: LINQ_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYMENT_LINK
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: PERFLO_AGENT_TOKEN
        sync: false
      - key: PERFLO_MANDATE_ID
        sync: false
      - key: ENRICHMENT_BUDGET_CENTS
        value: "500"
