# Fly.io app config for the Luma Connects FastAPI service.
# Sized to stay inside Fly's free monthly allowances: shared-cpu-1x/256MB,
# scale-to-zero when idle, and a single small persistent volume for SQLite.
app = "luma-connects-api"
primary_region = "sjc"

[build]

[env]
  INVITE_DB_PATH = "/data/invite_finder.db"
  INVITE_CORS_ORIGINS = "https://luma-connects.fly.dev"

[[mounts]]
  source = "invite_finder_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Must stay >= 1: this app receives Linq and Stripe webhooks. Scale-to-zero
  # drops them, and a machine stopped mid-run combines with reap_stuck_runs()
  # to mark an already-paid job failed on the next boot.
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
